<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#102033;#0B1220" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#143047">
        <animate attributeName="stop-color" values="#143047;#1B4060;#143047" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0E1C2F"/>
    </linearGradient>
    <linearGradient id="line" x1="40" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="200" fill="url(#g)"/>
    <circle cx="780" cy="30" r="110" fill="#38BDF8" opacity="0.10">
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="190" r="80" fill="#34D399" opacity="0.07"/>
    <text x="40" y="68" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="700">Jyothiranand S.</text>
    <rect x="40" y="82" width="210" height="3.5" rx="2" fill="url(#line)">
      <animate attributeName="width" values="70;230;70" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="120" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Full-stack software engineer</text>
    <text x="40" y="152" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Express  ·  Hono  ·  TypeScript  ·  Next.js  ·  PostgreSQL</text>
    <g>
      <rect x="700" y="138" width="150" height="36" rx="18" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
      <text x="775" y="161" text-anchor="middle" fill="#7DD3FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Open to roles</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
