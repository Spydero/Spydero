<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-label="Jyothiranand S. Full-stack software engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#101a2e;#0b1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#12263f">
        <animate attributeName="stop-color" values="#12263f;#1a3a55;#12263f" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="880" height="148" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="148" fill="url(#bg)"/>
    <circle cx="820" cy="20" r="70" fill="#38bdf8" opacity="0.12">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="52" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="700">Jyothiranand S.</text>
    <rect x="28" y="64" width="180" height="3" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="60;200;60" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="28" y="96" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Full-stack software engineer | Pune | Open to roles</text>
    <text x="28" y="124" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">&gt; TypeScript APIs | Next.js | NestJS | PostgreSQL | LLM workflows
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
