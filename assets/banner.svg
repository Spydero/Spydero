<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Jyothiranand S. Full-stack software engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#101a2e;#0b1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#12263f">
        <animate attributeName="stop-color" values="#12263f;#1a3a55;#12263f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0e1c2f">
        <animate attributeName="stop-color" values="#0e1c2f;#163048;#0e1c2f" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="880" height="180" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="180" fill="url(#bg)"/>
    <circle cx="760" cy="36" r="80" fill="url(#glow)">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="58" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700">Jyothiranand S.</text>
    <rect x="36" y="72" width="200" height="3" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="50;220;50" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="108" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Full-stack software engineer</text>
    <text x="36" y="140" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">TypeScript  |  Next.js  |  NestJS  |  PostgreSQL  |  AI</text>
    <g transform="translate(700 120)">
      <rect width="132" height="34" rx="17" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
      <text x="66" y="22" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Open to roles</text>
      <animateTransform attributeName="transform" type="translate" values="700 120;700 116;700 120" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
